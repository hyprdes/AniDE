[quickshell]
description = "QtQuick-based Wayland desktop shell and status bar for AniDE"

[[quickshell.dependency]]
yay = ["quickshell"]
paru = ["quickshell"]

[[quickshell.files]]
action = "sync"
source_root = "Configs/.config/quickshell"
target_root = "${XDG_CONFIG_HOME}/quickshell"
paths = [
    "shell.qml",
    "Colors.qml",
    "RoundCorner.qml",
    "LisaGlassIcon.qml",
    "CircleUtilButton.qml",
    "ClippedProgressBar.qml",
    "AniSubPanelFace.qml",
]

[[quickshell.files]]
action = "sync"
source_root = "Configs/.config/quickshell"
target_root = "${XDG_DATA_HOME}/quickshell"
paths = [
    "shell.qml",
    "Colors.qml",
    "RoundCorner.qml",
    "LisaGlassIcon.qml",
    "CircleUtilButton.qml",
    "ClippedProgressBar.qml",
    "AniSubPanelFace.qml",
    "theme.json",
]

[[quickshell.files]]
action = "preserve"
source_root = "Configs/.config/quickshell"
target_root = "${XDG_CONFIG_HOME}/quickshell"
paths = ["theme.json"]
