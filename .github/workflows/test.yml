name: Tests

on:
  push:
    branches:
      - dev
      - rc
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Configuration and script checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve test repository and branch
        id: resolve-tests
        env:
          REPO_OWNER: HyDE-Project
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login || '' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -eu

          target_owner="$REPO_OWNER"
          target_branch="main"

          branch_exists() {
            git ls-remote --heads --exit-code "https://github.com/$1/tests.git" "refs/heads/$2" >/dev/null 2>&1
          }

          if branch_exists "$REPO_OWNER" "$BRANCH_NAME"; then
            target_owner="$REPO_OWNER"
            target_branch="$BRANCH_NAME"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO_FULL" ] && [ -n "$FORK_OWNER" ] && branch_exists "$FORK_OWNER" "$BRANCH_NAME"; then
            target_owner="$FORK_OWNER"
            target_branch="$BRANCH_NAME"
          fi

          echo "owner=$target_owner" >> "$GITHUB_OUTPUT"
          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "Using tests from $target_owner/tests:$target_branch"

      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve-tests.outputs.owner }}/tests
          ref: ${{ steps.resolve-tests.outputs.branch }}
          path: tests
          persist-credentials: false
          fetch-depth: 1

      - name: Require test suite
        run: test -f tests/run.sh

      - name: Install test dependencies
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete 2>/dev/null || true
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://mirrors.edge.kernel.org/ubuntu/\nhttps://mirror.hetzner.com/ubuntu/packages/\nhttps://ftp.udx.icscoe.jp/Linux/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i -E 's|https?://([a-z0-9.-]+\.)?ubuntu\.com/ubuntu/?|https://mirrors.edge.kernel.org/ubuntu/|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt_opts="-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=30"
          sudo DEBIAN_FRONTEND=noninteractive apt-get $apt_opts update
          sudo DEBIAN_FRONTEND=noninteractive apt-get $apt_opts install -y --no-install-recommends --fix-missing \
            lua5.4 lua-filesystem lua-socket lua-argparse lua-dkjson shellcheck fish
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Report tool versions
        run: |
          lua -v
          shellcheck --version
          fish --version
          python3 --version

      # The suite owns the hyde-shell open priority case (test_open_priority,
      # moved out of .github/scripts/ in HyDE-Project/HyDE#2178), so there is no
      # second, separately maintained harness for it here.
      - name: Run the test suite
        run: sh tests/run.sh

  coverage:
    name: Shell coverage
    runs-on: ubuntu-24.04
    needs: test
    env:
      KCOV_VERSION: v43
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve test repository and branch
        id: resolve-tests
        env:
          REPO_OWNER: HyDE-Project
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login || '' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -eu

          target_owner="$REPO_OWNER"
          target_branch="main"

          branch_exists() {
            git ls-remote --heads --exit-code "https://github.com/$1/tests.git" "refs/heads/$2" >/dev/null 2>&1
          }

          if branch_exists "$REPO_OWNER" "$BRANCH_NAME"; then
            target_owner="$REPO_OWNER"
            target_branch="$BRANCH_NAME"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO_FULL" ] && [ -n "$FORK_OWNER" ] && branch_exists "$FORK_OWNER" "$BRANCH_NAME"; then
            target_owner="$FORK_OWNER"
            target_branch="$BRANCH_NAME"
          fi

          echo "owner=$target_owner" >> "$GITHUB_OUTPUT"
          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "Using tests from $target_owner/tests:$target_branch"

      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve-tests.outputs.owner }}/tests
          ref: ${{ steps.resolve-tests.outputs.branch }}
          path: tests
          persist-credentials: false
          fetch-depth: 1

      - name: Install test and coverage dependencies
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name 'ubuntu.sources' -delete 2>/dev/null || true
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://mirrors.edge.kernel.org/ubuntu/\nhttps://mirror.hetzner.com/ubuntu/packages/\nhttps://ftp.udx.icscoe.jp/Linux/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i -E 's|https?://([a-z0-9.-]+\.)?ubuntu\.com/ubuntu/?|https://mirrors.edge.kernel.org/ubuntu/|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt_opts="-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=30"
          sudo DEBIAN_FRONTEND=noninteractive apt-get $apt_opts update
          sudo DEBIAN_FRONTEND=noninteractive apt-get $apt_opts install -y --no-install-recommends --fix-missing \
            lua5.4 shellcheck fish \
            binutils-dev build-essential cmake ninja-build libssl-dev \
            libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev libiberty-dev
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Build the coverage tool
        run: |
          git clone --depth 1 --branch "$KCOV_VERSION" https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov"
          cmake -S "$RUNNER_TEMP/kcov" -B "$RUNNER_TEMP/kcov/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/kcov/build"
          sudo install -m 0755 "$RUNNER_TEMP/kcov/build/src/kcov" /usr/local/bin/kcov

      - name: Measure the suite
        run: |
          mkdir -p coverage
          kcov \
            --include-path=Scripts,Configs/.local/bin,Configs/.local/lib/hyde \
            --exclude-pattern=/tests/ \
            coverage sh tests/run.sh

      - name: Upload the report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: shell
          name: shell
          fail_ci_if_error: false
